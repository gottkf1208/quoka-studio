<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5차시 · 이야기 씨앗 심기 — 얼개 점검 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --c-bg:#EFEDE7; --c-ink:#3D434C; --c-sub:#7A766C;
  --c-mist:#AEC6D6; --c-mist-d:#3E5C6E;
  --c-sage:#BFD0B7; --c-sage-d:#4F6645;
  --c-lilac:#CBBFDC; --c-lilac-d:#5A4E75;
  --c-peach:#E8D2C1; --c-peach-d:#8A634A;
  --c-butter:#ECE1BE; --c-butter-d:#82743F;
  --c-accent:#FF5757; --c-accent-d:#B81E1E;
  --line:rgba(61,67,76,.10);
  --field:#FBFAF7;
  --shadow-sm:0 1px 2px rgba(61,67,76,.04), 0 6px 18px rgba(61,67,76,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--c-bg); color:var(--c-ink);
  font-size:16px; line-height:1.65; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--c-ink)}
.ov{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--c-sub)}

#app{max-width:680px;margin:0 auto;padding:26px 20px 34px}
#autoSave{
  position:fixed;right:14px;bottom:14px;z-index:60;pointer-events:none;
  background:var(--c-ink);color:#fff;font-size:12px;font-weight:800;
  padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .25s;
}
#autoSave.show{opacity:.92}
.head{margin-bottom:18px}
.head h1{font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.25;margin-top:6px}
.head .rule{width:48px;height:5px;border-radius:3px;background:var(--c-accent);margin:12px 0 10px}
.head .sub{font-size:14px;color:var(--c-sub)}

.card{
  background:#fff;border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:14px;
}
.card h2{font-size:16.5px;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.card .hint{color:var(--c-sub);font-size:13.5px;margin:-6px 0 14px}

/* 진행 점 */
.progress{display:flex;gap:6px;margin-bottom:16px}
.progress-dot{flex:1;height:5px;border-radius:3px;background:#DDDACF;transition:background .3s}
.progress-dot.done{background:var(--c-sage-d)}
.progress-dot.current{background:var(--c-accent)}

/* 시작 화면 힌트 */
.start-hint{
  display:flex;align-items:flex-start;gap:11px;
  padding:11px 4px;border-bottom:1px solid var(--line);font-size:14px;
}
.start-hint:last-of-type{border-bottom:none}
.sh-tag{
  flex-shrink:0;min-width:58px;text-align:center;
  padding:4px 10px;border-radius:8px;font-size:12.5px;font-weight:800;
}
.start-hint span.tx{color:#565c66;padding-top:2px}

/* 배경 씨앗 */
.row-line{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row-line:last-child{border-bottom:none}
.tag{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:64px;padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:800;flex-shrink:0;
  background:color-mix(in srgb,var(--c-mist) 32%,#fff);color:var(--c-mist-d);
}
.row-line input{
  flex:1;border:none;background:transparent;padding:5px 4px;font-size:15px;outline:none;
  border-bottom:1.5px solid transparent;transition:border-color .2s;min-width:0;
}
.row-line input:focus{border-bottom-color:var(--c-ink)}
input::placeholder,textarea::placeholder{color:#BDB9AE}

/* 요약 스트립 */
.summary-strip{padding:16px 20px}
.summary-strip .st-title{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--c-sub);margin-bottom:8px}
.stage-line{display:flex;gap:9px;font-size:13.5px;color:#565c66;padding:3px 0}
.stage-line b{flex-shrink:0;color:var(--c-ink)}

/* 단계 화면 */
.stage-label{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.stage-label h2{margin-bottom:0}
.fk-hint{font-size:12.5px;color:var(--c-sub);font-weight:600;margin-bottom:12px}
textarea.stage-ta{
  width:100%;min-height:96px;background:var(--field);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;font-size:15.5px;line-height:1.75;outline:none;
  resize:vertical;transition:border-color .2s;
}
textarea.stage-ta:focus{border-color:var(--c-ink)}

/* 피드백 */
.fb-box{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:13.8px;line-height:1.65;animation:pop .3s cubic-bezier(.22,.9,.36,1)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.fb-box.lv-A{background:color-mix(in srgb,var(--c-sage) 28%,#fff);color:var(--c-sage-d)}
.fb-box.lv-B{background:color-mix(in srgb,var(--c-butter) 34%,#fff);color:var(--c-butter-d)}
.fb-box.lv-C{background:color-mix(in srgb,var(--c-accent) 8%,#fff);color:var(--c-accent-d)}
.lv-badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 11px;border-radius:999px;color:#fff;margin-bottom:7px}
.lv-badge.lv-A{background:var(--c-sage-d)}
.lv-badge.lv-B{background:var(--c-butter-d)}
.lv-badge.lv-C{background:var(--c-accent)}

/* 버튼 */
.btn-row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--c-accent);color:#fff;font-weight:800;font-size:14.5px;
  padding:12px 22px;border-radius:12px;transition:transform .15s, background .15s, opacity .15s;
  box-shadow:0 6px 16px rgba(255,87,87,.22);
}
.btn:hover{transform:translateY(-1px);background:#F04A4A}
.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}
.btn.ghost{background:#fff;color:var(--c-ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--field);transform:none}
.btn.grow{flex:1}

/* 요약 화면 */
.final-item{border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:11px;background:#fff}
.final-item .ft{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.final-item .ft b{font-size:14.5px;letter-spacing:-.02em}
.edit-jump{
  margin-left:auto;flex-shrink:0;
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:5px 13px;font-size:12.5px;font-weight:800;color:var(--c-sub);
  transition:all .15s;
}
.edit-jump:hover{border-color:var(--c-ink);color:var(--c-ink)}
.final-item .stage-text{color:#565c66;font-size:13.8px;margin-bottom:7px;white-space:pre-wrap;line-height:1.6}
.final-item .stage-msg{font-size:12.8px;color:var(--c-sub);margin-bottom:11px;line-height:1.6}
.toggle-row{display:flex;gap:7px}
.toggle-btn{
  flex:1;max-width:150px;padding:7px 10px;font-size:12.5px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--c-sub);font-weight:800;transition:all .15s;
}
.toggle-btn:hover{border-color:var(--c-ink);color:var(--c-ink)}
.toggle-btn.on-keep{background:var(--c-sage-d);border-color:var(--c-sage-d);color:#fff}
.toggle-btn.on-fix{background:var(--c-accent);border-color:var(--c-accent);color:#fff}

.limit-note{
  margin-top:16px;padding:13px 16px;border-radius:12px;
  background:color-mix(in srgb,var(--c-butter) 30%,#fff);
  font-size:12.5px;color:#565c66;line-height:1.6;
}
.limit-note b{color:var(--c-butter-d)}

@media print{.btn-row,.progress{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══════ 스튜디오 저장소 연동 (내 책 미리보기와 공유) ═══════ */
const ST_KEY='quokka_studio_v1', LKEY='l5';
function stAll(){ try{ return JSON.parse(localStorage.getItem(ST_KEY))||{} }catch(e){ return {} } }
function stGet(){ const S=stAll(); return (S.ans&&S.ans[LKEY])||{} }
function stSet(kv){ try{ const S=stAll(); S.ans=S.ans||{}; S.ans[LKEY]=Object.assign(S.ans[LKEY]||{},kv); localStorage.setItem(ST_KEY,JSON.stringify(S)); flashSave(); }catch(e){} }

/* 자동 저장 배지 */
const _svBadge = document.createElement('div'); _svBadge.id='autoSave'; _svBadge.textContent='✓ 자동 저장됨';
document.addEventListener('DOMContentLoaded', ()=>document.body.appendChild(_svBadge));
let _svT;
function flashSave(){
  if(!_svBadge.isConnected && document.body) document.body.appendChild(_svBadge);
  _svBadge.classList.add('show');
  clearTimeout(_svT); _svT = setTimeout(()=>_svBadge.classList.remove('show'), 1200);
}
/* 저장하기 버튼 (모든 화면 공통) */
function saveAllNow(btn){
  const kv = {
    gi: state.inputs.기, seung: state.inputs.승, jeon: state.inputs.전, gyeol: state.inputs.결,
  };
  ['btime','bplace','bmood'].forEach(id=>{ const el=document.getElementById(id); if(el) kv[id]=el.value; });
  STAGES.forEach(st=>{ if(state.decisions[st.key]) kv[st.k+'_dec']=state.decisions[st.key]; });
  stSet(kv);
  if(btn){
    btn.textContent='✓ 모두 저장됐어요!';
    setTimeout(()=>{ btn.textContent='💾 지금까지 쓴 내용 저장하기'; }, 1600);
  }
}
document.addEventListener('click', e=>{
  if(e.target && e.target.id==='btn-saveall') saveAllNow(e.target);
});

/* ═══════ 데이터 ═══════ */
const APP_TITLE="기승전결 얼개 점검";
const STAGES=[
 {key:"기", k:"gi",    label:"기 — 이야기의 시작",     ph:"예) 아기 다람쥐는 겨울잠 자는 법을 몰라 걱정이 많다.", hint:"기: 주인공이 원하는 것이 잘 드러나야 해요.", col:"mist"},
 {key:"승", k:"seung", label:"승 — 사건이 커지는 부분", ph:"예) 부엉이를 만나 겨울잠 자는 법을 배우게 된다.",     hint:"승: 사건이 실제로 벌어지고 커져야 해요.", col:"sage"},
 {key:"전", k:"jeon",  label:"전 — 가장 힘든 순간",     ph:"예) 첫눈이 내렸는데 도토리를 모아두지 않아 먹을 게 없다.", hint:"전: 원하는 것과 두려운 것이 함께 부딪혀야 해요.", col:"peach"},
 {key:"결", k:"gyeol", label:"결 — 이야기의 마무리",   ph:"예) 힘들었지만 이웃 다람쥐와 나눠 먹으며 겨울을 났다.",  hint:"결: 주인공이 '기'와 비교해 조금이라도 달라져야 해요.", col:"lilac"},
];
const COLV={mist:['#3E5C6E','#AEC6D6'],sage:['#4F6645','#BFD0B7'],peach:['#8A634A','#E8D2C1'],lilac:['#5A4E75','#CBBFDC']};
function tagStyle(col){const c=COLV[col];return `background:color-mix(in srgb,${c[1]} 34%,#fff);color:${c[0]}`}

/* ═══════ 판정 엔진 (얼개 점검 도우미 원본) ═══════ */
const NEG_AFTER=["지 않","지않","않았","않는","않아","못했","못한다","못하고","못하는","못해"];
const NEG_BEFORE_RE=/(^|[^가-힣])안\s?$/;
function mk(list,neg){return list.map(w=>({w,neg}));}
const WANT_ENTRIES=mk(["원한다","원했다","원하는","원하고","원한","원하다","원해","원하","바란다","바랐다","바라는","바라며","바라고","바란","바라다","바래","바랬","바라","꿈꾼다","꿈꿨다","꿈꾸는","꿈이었","꿈꾼","꿈꾸고","꿈꾸다","꿈꿔","꿈은","꿈꾸","부럽다","부러워","부러웠","부러운","부럽고","부럽","좋겠다","좋겠어","좋겠","기대한다","기대했다","기대되는","기대감","기대하는","기대한","기대하고","기대하다","기대해","기대돼","기대됐","기대하","동경한다","동경했다","동경한","동경","갈망한다","갈망했다","갈망한","갈망","소원","소망","할 거야","할거야","하고 말겠다","말겠다","싶다","싶어","싶었","싶고","싶은","싶네","싶으니","싶"],true);
const PURPOSE_ENTRIES=mk(["위해","위한","하려고","하고자"],false);

function findSignal(text,entries){
  let negatedAny=false;
  for(const {w,neg} of entries){
    let from=0;
    while(true){
      const idx=text.indexOf(w,from);
      if(idx===-1) break;
      if(!neg) return {found:true,negated:false,matched:w};
      const after=text.slice(idx+w.length, idx+w.length+8);
      const before=text.slice(Math.max(0,idx-3), idx);
      const isNeg=NEG_AFTER.some(n=>after.includes(n))||NEG_BEFORE_RE.test(before);
      if(!isNeg) return {found:true,negated:false,matched:w};
      negatedAny=true; from=idx+1;
    }
  }
  return {found:false,negated:negatedAny,matched:null};
}
function classify(sk,text){
  const t=(text||"").trim();
  if(!t) return {level:"C",empty:true};
  if(sk==="기"){ const want=findSignal(t,WANT_ENTRIES), long=t.length>=12;
    let level="B"; if(want.found&&long) level="A"; else if(!want.found&&!want.negated&&!long) level="C";
    return {level,want,long}; }
  if(sk==="승"){ const trans=findSignal(t,TRANSITION_ENTRIES), long=t.length>=12;
    let level="B"; if(trans.found&&long) level="A"; else if(!trans.found&&!long) level="C";
    return {level,trans,long}; }
  if(sk==="전"){ const goal=findSignal(t,[...WANT_ENTRIES,...PURPOSE_ENTRIES,...ACHIEVEMENT_ENTRIES]);
    const fear=findSignal(t,FEAR_ENTRIES);
    const hasConnective=CONTRAST_ENTRIES.some(e=>t.includes(e.w));
    let level="B"; if(goal.found&&fear.found) level="A";
    else if((!goal.found&&!goal.negated)&&(!fear.found&&!fear.negated)) level="C";
    return {level,goal,fear,hasConnective}; }
  if(sk==="결"){ const change=findSignal(t,CHANGE_ENTRIES), long=t.length>=10;
    let level="B"; if(change.found&&long) level="A"; else if(!change.found&&!change.negated&&!long) level="C";
    return {level,change,long}; }
}

function renderStrip(upto){
  if(upto===0) return "";
  let h='<div class="card summary-strip"><div class="st-title">지금까지 쓴 얼개</div>';
  for(let i=0;i<upto;i++){
    const s=STAGES[i];
    h+=`<div class="stage-line"><b>${s.key}</b><span>${escH(state.inputs[s.key]||"(비어 있음)")}</span></div>`;
  }
  return h+"</div>";
}

/* 단계 화면 */
function renderStage(idx){
  const st=STAGES[idx];
  const checked=state.checked[st.key];
  const result=state.results[st.key];
  let fb="";
  if(checked&&result){
    const lab=result.level==="A"?"뚜렷해요":result.level==="B"?"조금 더 살펴볼까요":"아직 잘 안 보여요";
    fb=`<div class="fb-box lv-${result.level}"><span class="lv-badge lv-${result.level}">${lab}</span><div>${escH(getMessage(st.key,result))}</div></div>`;
  }
  app.innerHTML=`
  ${headHtml("한 단계씩 쓰고 확인해봐요. 수정하면 다시 확인!")}
  ${renderProgress()}
  ${renderStrip(idx)}
  <div class="card">
    <div class="stage-label"><span class="sh-tag" style="${tagStyle(st.col)}">${st.key}</span><h2>${st.label.split(" — ")[1]}</h2></div>
    <div class="fk-hint">${st.hint.split(": ")[1]}</div>
    <textarea id="stage-input" class="stage-ta" placeholder="${st.ph}">${escH(state.inputs[st.key])}</textarea>
    ${fb}
    <div class="btn-row">
      <button class="btn ghost" id="btn-check">이 문장 확인해보기</button>
      ${idx>0?'<button class="btn ghost" id="btn-prev">← 이전</button>':''}
      ${Object.values(state.inputs).every(v=>v&&v.trim())?'<button class="btn ghost" id="btn-gosummary">점검 결과로 →</button>':''}
      <button class="btn grow" id="btn-next" ${checked?'':'disabled'}>${idx===3?'점검 결과 보기 ✦':'다음 단계로 →'}</button>
    </div>
  </div>
  <div class="limit-note">${LIMIT}</div>
  <button class="btn ghost" id="btn-saveall" style="width:100%;margin-top:10px">💾 지금까지 쓴 내용 저장하기</button>`;

  const ta=document.getElementById("stage-input");
  ta.addEventListener("input",()=>{
    state.inputs[st.key]=ta.value;
    state.checked[st.key]=false;
    persistStage(st);
    document.getElementById("btn-next").disabled=true;
    const f=document.querySelector(".fb-box"); if(f) f.remove();
  });
  document.getElementById("btn-check").addEventListener("click",()=>{
    state.inputs[st.key]=ta.value; persistStage(st);
    const r=classify(st.key,ta.value);
    state.results[st.key]=r; state.checked[st.key]=true;
    if(!state.decisions[st.key]){ state.decisions[st.key]=(r.level==="A")?"keep":"fix"; persistDec(st); }
    renderStage(idx);
  });
  const pb=document.getElementById("btn-prev");
  if(pb) pb.addEventListener("click",()=>{ state.step--; render(); });
  const gs=document.getElementById("btn-gosummary");
  if(gs) gs.addEventListener("click",()=>{ state.inputs[st.key]=ta.value; persistStage(st); state.step=4; render(); });
  document.getElementById("btn-next").addEventListener("click",()=>{
    if(!state.checked[st.key]) return;
    state.step++; render();
  });
}

/* 요약 화면 */
function renderSummary(){
  let items="";
  STAGES.forEach((st,i)=>{
    const r=state.results[st.key]||classify(st.key,state.inputs[st.key]);
    const msg=getMessage(st.key,r);
    const dec=state.decisions[st.key]||"fix";
    items+=`
    <div class="final-item">
      <div class="ft"><span class="sh-tag" style="${tagStyle(st.col)}">${st.key}</span><b>${st.label.split(" — ")[1]}</b>
        <button class="edit-jump no-print" data-idx="${i}" title="이 단계만 바로 고치러 가기">✏️ 고치기</button></div>
      <div class="stage-text">${escH(state.inputs[st.key]||"(비어 있음)")}</div>
      <div class="stage-msg">${escH(msg)}</div>
      <div class="toggle-row" data-stage="${st.key}">
        <button class="toggle-btn ${dec==='keep'?'on-keep':''}" data-choice="keep">그대로 둘 것</button>
        <button class="toggle-btn ${dec==='fix'?'on-fix':''}" data-choice="fix">고칠 것</button>
      </div>
    </div>`;
  });
  app.innerHTML=`
  ${headHtml("내가 쓴 얼개가 한눈에! 고치고 싶은 단계만 ✏️ 고치기를 눌러 바로 고쳐요.")}
  ${renderProgress()}
  <div class="card"><h2>내 얼개 점검 결과 ✦</h2>${items}</div>
  <div class="btn-row no-print">
    <button class="btn ghost" id="btn-seed">🌱 배경 씨앗 보기·고치기</button>
    <button class="btn ghost" id="btn-back">← 처음부터 다시 살펴보기</button>
    <button class="btn grow" id="btn-print">이 결과 인쇄 · 저장하기</button>
  </div>
  <div class="limit-note">${LIMIT}</div>
  <button class="btn ghost" id="btn-saveall" style="width:100%;margin-top:10px">💾 지금까지 쓴 내용 저장하기</button>`;
  document.querySelectorAll(".toggle-btn").forEach(b=>{
    b.addEventListener("click",e=>{
      const key=e.target.closest(".toggle-row").dataset.stage;
      state.decisions[key]=e.target.dataset.choice;
      persistDec(STAGES.find(s=>s.key===key));
      renderSummary();
    });
  });
  document.querySelectorAll(".edit-jump").forEach(b=>{
    b.addEventListener("click",()=>{ state.step=+b.dataset.idx; render(); });
  });
  document.getElementById("btn-seed").addEventListener("click",()=>{ state.step=-1; render(); });
  document.getElementById("btn-back").addEventListener("click",()=>{ state.step=0; render(); });
  document.getElementById("btn-print").addEventListener("click",()=>window.print());
}

render();

/* 부모(스튜디오)에 실제 높이를 알려 하단 여백 없이 맞추기 */
(function(){
  if(window.parent === window) return;
  let t, lastH = 0;
  function report(){
    clearTimeout(t);
    t = setTimeout(()=>{
      /* scrollHeight는 iframe이 크면 그 값을 돌려줘 줄어들지 않는다 —
         실제 콘텐츠의 바닥 좌표를 직접 잰다 (fixed 요소 제외) */
      let max = 0;
      for(const el of document.body.children){
        const cs = getComputedStyle(el);
        if(cs.position === 'fixed' || cs.display === 'none') continue;
        const r = el.getBoundingClientRect();
        max = Math.max(max, r.bottom + window.scrollY + (parseFloat(cs.marginBottom)||0));
      }
      const h = Math.ceil(max + (parseFloat(getComputedStyle(document.body).paddingBottom)||0));
      if(h > 100 && Math.abs(h - lastH) > 2){ lastH = h; parent.postMessage({qkFrameH: h}, '*'); }
    }, 80);
  }
  new MutationObserver(report).observe(document.documentElement, {childList:true, subtree:true, attributes:true});
  addEventListener('load', report);
  addEventListener('resize', report);
  setInterval(report, 700);
  report();
})();
</script>
