<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>갈등 장면 다시 쓰기 · AI 동화작가 데뷔 스튜디오</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --c-bg:#EFEDE7; --c-ink:#3D434C; --c-sub:#7A766C;
  --c-mist:#AEC6D6; --c-mist-d:#3E5C6E;
  --c-sage:#BFD0B7; --c-sage-d:#4F6645;
  --c-lilac:#CBBFDC; --c-lilac-d:#5A4E75;
  --c-peach:#E8D2C1; --c-peach-d:#8A634A;
  --c-butter:#ECE1BE; --c-butter-d:#82743F;
  --c-accent:#FF5757; --c-accent-d:#B81E1E;
  --line:rgba(61,67,76,.10);
  --card-r:18px;
  --shadow-sm:0 1px 2px rgba(61,67,76,.04), 0 6px 18px rgba(61,67,76,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--c-bg); color:var(--c-ink);
  font-size:16px; line-height:1.65; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:var(--c-ink)}
main{max-width:920px;margin:0 auto;padding:34px 24px 60px}

h2.sec{font-size:27px;font-weight:900;letter-spacing:-.035em;margin:6px 0 6px}
p.sec-sub{color:var(--c-sub);margin-bottom:22px;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 13px;border-radius:999px;font-size:12.5px;font-weight:800}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}

.ws-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--card-r);
  box-shadow:var(--shadow-sm);padding:26px 28px;margin-bottom:16px;
}
.ws-card h4{font-size:15.5px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
input::placeholder,textarea::placeholder{color:#BDB9AE}

/* 실마리 챗봇 카드 */
.bot-card{background:linear-gradient(180deg,#FBFAF7 0%, #fff 100%)}
.bot-card .bot-emoji{font-size:38px;margin-bottom:10px;line-height:1}
.bot-card h5{font-size:20px;font-weight:900;letter-spacing:-.02em;margin-bottom:10px;color:var(--c-ink)}
.bot-card p{font-size:15.5px;color:var(--c-sub);margin-bottom:22px;line-height:1.6;font-weight:500}
.bot-open{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:#fff;border:1.5px dashed #C9C5BA;border-radius:14px;
  padding:16px;font-weight:800;font-size:15.5px;color:var(--c-sub);
}

/* 세 겹 요약 */
.recap{background:#FBFAF7;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.recap .rc-head{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--c-sub);margin-bottom:9px}
.recap .rc-row{display:flex;gap:9px;padding:5px 0;font-size:14px;line-height:1.6}
.recap .rc-row b{flex:0 0 52px;font-size:12.5px;padding-top:2px}
.recap .empty{color:#BDB9AE;font-size:13.5px}
.rc-1 b{color:var(--c-mist-d)} .rc-2 b{color:var(--c-peach-d)} .rc-3 b{color:var(--c-sage-d)}

.big-ta{
  width:100%;min-height:260px;border:1px solid var(--line);background:#FBFAF7;border-radius:12px;
  padding:16px 18px;font-size:15.5px;line-height:1.85;outline:none;resize:vertical;transition:border-color .2s;
}
.big-ta:focus{border-color:var(--c-ink)}
.ta-meta{display:flex;align-items:center;margin-top:10px;font-size:13px;color:var(--c-sub)}
.ta-meta b{margin-left:auto}

#autoSave{
  position:fixed;right:14px;bottom:14px;z-index:60;pointer-events:none;
  background:var(--c-ink);color:#fff;font-size:12px;font-weight:800;
  padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .25s;
}
#autoSave.show{opacity:.92}

@media (max-width:720px){ main{padding:24px 16px 50px} h2.sec{font-size:23px} .ws-card{padding:20px 18px} }
</style>
</head>
<body>
<main>

  <span class="pill" style="background:var(--c-peach);color:var(--c-peach-d)">
    <span class="dot" style="background:var(--c-peach-d)"></span>활동 3 · 갈등 장면 다시 쓰기
  </span>
  <h2 class="sec">갈등 장면 다시 쓰기</h2>
  <p class="sec-sub">활동 1에서 찾은 갈등 세 겹을 도우미 '실마리'에게 알려 주고,<br>받은 실마리로 내 갈등 장면을 다시 써 보세요.</p>

  <section class="ws-card bot-card">
    <div class="bot-emoji">🧶</div>
    <h5>갈등 장면 도우미 '실마리'</h5>
    <p>내 갈등 세 겹(겉으로 벌어진 일 · 그 때 든 감정 · 진짜 바람)을 알려 주면, 장면을 풀어 갈 실마리를 질문으로 건네줘요.</p>
    <div class="bot-open">🔗 챗봇 링크 준비 중 — 선생님이 안내하는 주소로 접속해요</div>
  </section>

  <section class="ws-card">
    <h4>내가 적은 갈등 세 겹</h4>
    <div id="recapBox"></div>
  </section>

  <section class="ws-card">
    <h4>갈등 장면 다시 쓰기 메모장</h4>
    <textarea class="big-ta" id="sceneTa" placeholder="실마리에게 받은 질문을 떠올리며, 갈등 장면을 다시 써 보세요.&#10;겉으로 벌어진 일만 쓰지 말고, 속마음과 진짜 바람이 살짝 비치게!"></textarea>
    <div class="ta-meta"><span>쓰는 대로 자동 저장돼요</span><b id="cnt">0자</b></div>
  </section>

</main>

<script>
/* ═══════ 스튜디오 저장소 연동 ═══════ */
const ST_KEY='quokka_studio_v1', LKEY='l7';
function stAll(){ try{ return JSON.parse(localStorage.getItem(ST_KEY))||{} }catch(e){ return {} } }
function stGet(){ const S=stAll(); return (S.ans&&S.ans[LKEY])||{} }
function stSet(kv){ try{ const S=stAll(); S.ans=S.ans||{}; S.ans[LKEY]=Object.assign(S.ans[LKEY]||{},kv); localStorage.setItem(ST_KEY,JSON.stringify(S)); flashSave(); }catch(e){} }
const _svBadge=document.createElement('div'); _svBadge.id='autoSave'; _svBadge.textContent='✓ 자동 저장됨';
let _svT;
function flashSave(){
  if(!_svBadge.isConnected && document.body) document.body.appendChild(_svBadge);
  _svBadge.classList.add('show');
  clearTimeout(_svT); _svT=setTimeout(()=>_svBadge.classList.remove('show'),1200);
}
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* 세 겹 요약 (활동 1에서 저장한 내용) */
function renderRecap(){
  const cs = stGet().conflicts || [];
  const box = document.getElementById('recapBox');
  const filled = cs.filter(c=>(c.s1||c.s2||c.s3));
  if(!filled.length){
    box.innerHTML = '<div class="recap"><span class="empty">아직 활동 1에서 적은 갈등이 없어요. 위 활동에서 세 겹을 먼저 적어 보세요.</span></div>';
    return;
  }
  box.innerHTML = filled.map((c,i)=>`
    <div class="recap">
      <div class="rc-head">갈등 ${i+1}</div>
      <div class="rc-row rc-1"><b>한 겹</b><span>${esc(c.s1)||'—'}</span></div>
      <div class="rc-row rc-2"><b>두 겹</b><span>${esc(c.s2)||'—'}</span></div>
      <div class="rc-row rc-3"><b>세 겹</b><span>${esc(c.s3)||'—'}</span></div>
    </div>`).join('');
}
renderRecap();
window.addEventListener('storage', e=>{ if(e.key===ST_KEY) renderRecap(); });

/* 메모장 */
const ta=document.getElementById('sceneTa'), cnt=document.getElementById('cnt');
ta.value = stGet().scene || '';
cnt.textContent = ta.value.length + '자';
ta.addEventListener('input',()=>{ stSet({scene:ta.value}); cnt.textContent = ta.value.length + '자'; });

/* 부모(스튜디오)에 실제 높이를 알려 하단 여백 없이 맞추기 */
(function(){
  if(window.parent === window) return;
  let t, lastH = 0;
  function report(){
    clearTimeout(t);
    t = setTimeout(()=>{
      let max = 0;
      for(const el of document.body.children){
        const cs = getComputedStyle(el);
        if(cs.position === 'fixed' || cs.display === 'none') continue;
        const r = el.getBoundingClientRect();
        max = Math.max(max, r.bottom + window.scrollY + (parseFloat(cs.marginBottom)||0));
      }
      const h = Math.ceil(max + (parseFloat(getComputedStyle(document.body).paddingBottom)||0));
      if(h > 100 && Math.abs(h - lastH) > 2){ lastH = h; parent.postMessage({qkFrameH: h}, '*'); }
    }, 80);
  }
  new MutationObserver(report).observe(document.documentElement, {childList:true, subtree:true, attributes:true});
  addEventListener('load', report);
  addEventListener('resize', report);
  setInterval(report, 700);
  report();
})();
</script>
</body>
</html>
