<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 동화작가 데뷔 스튜디오 · 쿼카연구회</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ── 컬러 토큰 (컬러차트 · 60/30/10) ───────
   60% 포그 그레이 바탕 · 30% 파스텔 면 · 10% 일렉트릭 코랄 */
:root{
  --c-bg:#EFEDE7; --c-ink:#3D434C; --c-sub:#7A766C;
  --c-mist:#AEC6D6; --c-mist-d:#3E5C6E;
  --c-sage:#BFD0B7; --c-sage-d:#4F6645;
  --c-lilac:#CBBFDC; --c-lilac-d:#5A4E75;
  --c-peach:#E8D2C1; --c-peach-d:#8A634A;
  --c-butter:#ECE1BE; --c-butter-d:#82743F;
  --c-accent:#FF5757; --c-accent-d:#B81E1E;
  --c-cobalt:#2E5BFF;
  --line:rgba(61,67,76,.10);
  --card-r:18px;
  --shadow:0 1px 2px rgba(61,67,76,.04), 0 14px 36px rgba(61,67,76,.07);
  --shadow-sm:0 1px 2px rgba(61,67,76,.04), 0 6px 18px rgba(61,67,76,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--c-bg); color:var(--c-ink);
  font-size:16px; line-height:1.65; letter-spacing:-0.01em;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:15px;color:var(--c-ink)}
img{display:block}
.ov{font-size:11.5px;font-weight:800;letter-spacing:.16em;color:var(--c-sub)}

/* ── 헤더 ─────────────────────────────── */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(239,237,231,.86); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.hd-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:13px 24px}
.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo img{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:var(--shadow-sm)}
.logo b{font-size:16px;letter-spacing:-.02em}
.logo span{font-size:12px;color:var(--c-sub);letter-spacing:0}
nav{margin-left:auto;display:flex;gap:22px;flex-wrap:wrap}
.nav-btn{position:relative;padding:6px 0;font-size:14.5px;font-weight:700;color:var(--c-sub);transition:color .18s}
.nav-btn:hover{color:var(--c-ink)}
.nav-btn.on{color:var(--c-ink)}
.nav-btn.on::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:3px;border-radius:3px;background:var(--c-accent)}

/* ── 레이아웃 공통 ─────────────────────── */
main{max-width:1200px;margin:0 auto;padding:30px 24px 48px}
.view{display:none}
.view.show{display:block;animation:slideIn .38s cubic-bezier(.22,.9,.36,1)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:translateX(0)}}
.view.show.back{animation:slideBack .38s cubic-bezier(.22,.9,.36,1)}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:translateX(0)}}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow-sm);padding:26px 28px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:4px 13px;border-radius:999px;font-size:12.5px;font-weight:800;letter-spacing:.01em}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--c-accent);color:#fff;font-weight:800;font-size:15.5px;
  padding:13px 26px;border-radius:12px;
  transition:transform .15s, box-shadow .15s, background .15s;
  box-shadow:0 6px 16px rgba(255,87,87,.25);
}
.cta:hover{transform:translateY(-1px);background:#F04A4A}
.cta.ghost{background:#fff;color:var(--c-ink);box-shadow:none;border:1px solid var(--line)}
.cta.ghost:hover{background:#FBFAF7}
.cta.done{background:color-mix(in srgb,var(--c-sage) 45%,#fff);color:var(--c-sage-d);box-shadow:none}
h2.sec{font-size:27px;font-weight:900;letter-spacing:-.035em;margin-bottom:6px}
p.sec-sub{color:var(--c-sub);margin-bottom:24px;font-size:15px}

/* 쿼카 */
.qk{border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:var(--shadow)}
.qk-float{animation:floaty 5.5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.blob-bg{position:absolute;border-radius:50%;pointer-events:none}

/* ── 홈 ───────────────────────────────── */
.hero{
  position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);
  border-radius:24px;box-shadow:var(--shadow);
  padding:56px 52px 48px;margin-bottom:28px;
}
.hero .b1{width:230px;height:230px;background:var(--c-mist);opacity:.28;top:-90px;right:-60px}
.hero .b2{width:130px;height:130px;background:var(--c-sage);opacity:.25;bottom:-50px;right:210px}
.hero .b3{width:70px;height:70px;background:var(--c-lilac);opacity:.22;top:52px;right:330px}
.hero-tag{background:var(--c-peach);color:var(--c-peach-d);margin-bottom:18px}
.hero h1{font-size:42px;font-weight:900;letter-spacing:-.045em;line-height:1.22}
.hero .rule{width:56px;height:5px;border-radius:3px;background:var(--c-accent);margin:18px 0 16px}
.hero .sub{font-size:16.5px;color:var(--c-sub);margin-bottom:28px;max-width:540px}
.hero-qk{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:180px;height:180px}
.hero-principles{display:flex;gap:12px;flex-wrap:wrap}
.pr-chip{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:13.5px;max-width:350px;color:var(--c-sub)}
.pr-chip b{display:flex;align-items:center;gap:8px;margin-bottom:3px;font-size:14.5px;color:var(--c-ink)}

.home-grid{display:grid;grid-template-columns:1fr 336px;gap:22px;align-items:start}
.stage-block{margin-bottom:26px}
.stage-head{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;padding-left:2px}
.stage-head .ov b{color:var(--c-ink)}
.stage-head span.rng{font-size:12.5px;color:var(--c-sub)}
.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lcard{
  background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:15px 17px;display:flex;align-items:center;gap:13px;cursor:pointer;
  transition:transform .16s, box-shadow .16s;text-align:left;
}
.lcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}
.lnum{
  min-width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;
}
.lcard .lt{font-weight:700;font-size:14.5px;letter-spacing:-.02em;line-height:1.35}
.lcard .ls{font-size:12.5px;color:var(--c-sub)}
.lcard .chk{margin-left:auto;font-size:14px;font-weight:900;color:var(--c-sage-d)}

.side-card{background:#fff;border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:16px}
.side-card h3{font-size:15.5px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
.progress-ring{display:flex;align-items:center;gap:16px}
.pr-num{font-size:32px;font-weight:900;letter-spacing:-.03em}
.pr-num small{font-size:14px;color:var(--c-sub);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--c-bg);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c-ink);transition:width .5s}
.quick-links{display:flex;flex-direction:column}
.ql{
  display:flex;align-items:center;gap:10px;padding:11px 2px;font-size:14px;font-weight:600;
  color:var(--c-ink);text-decoration:none;border-bottom:1px solid var(--line);transition:color .15s;
}
.ql:last-child{border-bottom:none}
.ql:hover{color:var(--c-accent-d)}
.ql::after{content:'↗';margin-left:auto;font-size:13px;color:var(--c-sub)}
.att-big{
  width:100%;margin-top:14px;background:var(--c-ink);color:#fff;
  font-weight:800;font-size:15px;padding:14px;border-radius:12px;transition:all .15s;
}
.att-big:hover{transform:translateY(-1px)}
.att-big.did{background:color-mix(in srgb,var(--c-sage) 40%,#fff);color:var(--c-sage-d)}

/* ── 차시 실습 ─────────────────────────── */
.les-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.helper-badge{
  margin-left:auto;background:#fff;border:1px solid var(--line);
  padding:7px 15px;border-radius:999px;font-size:13px;font-weight:800;
  display:inline-flex;align-items:center;gap:8px;
}
/* 차시 번호 내비게이션 */
.lnav-wrap{
  background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-sm);
  padding:12px 16px 13px;margin:10px 0 18px;
}
.lnav-head{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.lnav-cap{font-size:12px;color:var(--c-sub)}
.lnav{display:flex;gap:6px;flex-wrap:wrap}
.lnav-chip{
  position:relative;width:40px;height:40px;border-radius:12px;
  font-size:13.5px;font-weight:800;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;
  transition:transform .14s, box-shadow .14s;
}
.lnav-chip:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm)}
.lnav-chip.cur{
  background:var(--c-accent);color:#fff;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent) 25%,#fff), 0 4px 10px rgba(255,87,87,.3);
}
.lnav-chip i{
  position:absolute;top:-5px;right:-5px;font-style:normal;
  width:16px;height:16px;border-radius:50%;background:var(--c-sage-d);color:#fff;
  font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;
  border:1.5px solid #fff;
}
.lnav-chip.cur i{background:#fff;color:var(--c-sage-d)}
@media(max-width:640px){.lnav-chip{width:35px;height:35px;font-size:12.5px;border-radius:10px}}
.les-grid{display:grid;grid-template-columns:1fr 400px;gap:22px;align-items:start}
.les-head h2{font-size:31px;font-weight:900;letter-spacing:-.04em;line-height:1.25;margin-top:6px}
.les-head .sub2{color:var(--c-sub);font-size:15.5px;margin-top:4px}
.goals{margin:16px 0 22px;display:flex;flex-direction:column;gap:6px}
.goals div{display:flex;gap:10px;font-size:14px;color:#565c66}
.goals div::before{content:'—';color:var(--c-sub);flex-shrink:0}
.ws-card{background:#fff;border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow-sm);padding:24px 26px;margin-bottom:14px}
.ws-card h4{font-size:15.5px;font-weight:800;margin-bottom:14px;letter-spacing:-.02em}
.tag{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:76px;padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:800;flex-shrink:0;
}
.row-line{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row-line:last-child{border-bottom:none}
.row-line input{
  flex:1;border:none;background:transparent;padding:5px 4px;font-size:15px;outline:none;
  border-bottom:1.5px solid transparent;transition:border-color .2s;line-height:1.55;
}
.row-line input:focus{border-bottom-color:var(--c-ink)}
.row-line input::placeholder,.big-ta::placeholder,.pair-grid textarea::placeholder,.triage-inputs input::placeholder{color:#BDB9AE}
.pills-wrap{display:flex;flex-wrap:wrap;gap:8px}
.e-pill{
  padding:8px 18px;border-radius:999px;font-size:14px;font-weight:700;
  background:#fff;border:1px solid var(--line);color:var(--c-sub);transition:all .15s;
}
.e-pill:hover{border-color:var(--c-ink);color:var(--c-ink)}
.e-pill.sel{background:var(--c-ink);border-color:var(--c-ink);color:#fff}
.big-ta{
  width:100%;min-height:240px;border:1px solid var(--line);background:#FBFAF7;border-radius:12px;
  padding:16px 18px;font-size:15.5px;line-height:1.8;outline:none;resize:vertical;transition:border-color .2s;
}
.big-ta:focus{border-color:var(--c-ink)}
.ta-meta{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--c-sub)}
.timer-btn{background:#fff;border:1px solid var(--line);color:var(--c-ink);font-weight:800;padding:7px 16px;border-radius:999px;font-size:13px}
.timer-btn.run{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.radio-cards{display:grid;gap:9px}
.r-card{
  display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;text-align:left;width:100%;
}
.r-card:hover{border-color:#B9B5AA}
.r-card.sel{border-color:var(--c-ink);box-shadow:inset 0 0 0 1px var(--c-ink)}
.r-card .rdot{width:18px;height:18px;border-radius:50%;border:2px solid #C9C5BA;flex-shrink:0;margin-top:3px;transition:all .15s}
.r-card.sel .rdot{border-color:var(--c-ink);background:var(--c-ink);box-shadow:inset 0 0 0 3.5px #fff}
.r-card b{font-size:15px}
.r-card p{font-size:13.5px;color:var(--c-sub);margin-top:2px}
.check-list{display:flex;flex-direction:column;gap:8px}
.ck{
  display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:12px 15px;cursor:pointer;font-size:14.5px;font-weight:600;
  transition:all .15s;text-align:left;width:100%;
}
.ck:hover{border-color:#B9B5AA}
.ck .box{width:20px;height:20px;border-radius:6px;border:1.5px solid #C9C5BA;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;transition:all .15s;margin-top:2px}
.ck.sel .box{background:var(--c-ink);border-color:var(--c-ink)}
.pair-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.pair-grid .ph-head{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--c-sub);padding-bottom:7px}
.pair-grid textarea{
  width:100%;background:#FBFAF7;border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-size:14.5px;outline:none;resize:none;min-height:68px;line-height:1.6;margin-bottom:10px;transition:border-color .2s;
}
.pair-grid textarea:focus{border-color:var(--c-ink)}
.triage-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.triage-row:last-child{border:none}
.triage-inputs{flex:1;display:flex;flex-direction:column;gap:6px}
.triage-inputs input{background:#FBFAF7;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:14.5px;outline:none;transition:border-color .2s}
.triage-inputs input:focus{border-color:var(--c-ink)}

/* 5차시 얼개 점검 도우미 */
.fk-note{font-size:13.5px;color:var(--c-sub);margin-bottom:12px;line-height:1.6}
.fk-note b{color:var(--c-ink)}
.fk-row{padding:13px 0;border-bottom:1px solid var(--line)}
.fk-row:last-of-type{border-bottom:none}
.fk-top{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.fk-hint{font-size:12.5px;color:var(--c-sub);font-weight:600}
.fk-ta{width:100%;min-height:58px;background:#FBFAF7;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14.5px;line-height:1.65;outline:none;resize:vertical;transition:border-color .2s;font-family:inherit;color:var(--c-ink)}
.fk-ta:focus{border-color:var(--c-ink)}
.fk-ta::placeholder{color:#BDB9AE}
.fk-act{margin-top:8px}
.fk-check{background:#fff;border:1px solid var(--line);color:var(--c-ink);font-weight:800;padding:7px 16px;border-radius:999px;font-size:13px;transition:all .15s}
.fk-check:hover{border-color:var(--c-ink)}
.fb-box{margin-top:10px;border-radius:12px;padding:13px 15px;font-size:13.8px;line-height:1.65}
.fb-box.lv-A{background:color-mix(in srgb,var(--c-sage) 28%,#fff);color:var(--c-sage-d)}
.fb-box.lv-B{background:color-mix(in srgb,var(--c-butter) 34%,#fff);color:var(--c-butter-d)}
.fb-box.lv-C{background:color-mix(in srgb,var(--c-accent) 8%,#fff);color:var(--c-accent-d)}
.lv-badge{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.02em;padding:3px 11px;border-radius:999px;color:#fff;margin-bottom:7px}
.lv-badge.lv-A{background:var(--c-sage-d)}
.lv-badge.lv-B{background:var(--c-butter-d)}
.lv-badge.lv-C{background:var(--c-accent)}
.fk-dec{display:flex;gap:7px;margin-top:11px}
.dec-btn{flex:1;max-width:150px;padding:7px 10px;font-size:12.5px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--c-sub);font-weight:800;transition:all .15s}
.dec-btn:hover{border-color:var(--c-ink);color:var(--c-ink)}
.dec-btn.keep.on{background:var(--c-sage-d);border-color:var(--c-sage-d);color:#fff}
.dec-btn.fix.on{background:var(--c-accent);border-color:var(--c-accent);color:#fff}
.fk-limit{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--c-sub);line-height:1.6}
.fk-limit b{color:var(--c-ink)}

/* 공용 노트 · 15차시 질문형 입력 */
.ws-note{font-size:13px;color:var(--c-sub);line-height:1.6}
.q-row{padding:12px 0;border-bottom:1px solid var(--line)}
.q-row:last-child{border-bottom:none;padding-bottom:2px}
.q-fixed{font-size:14px;font-weight:700;color:var(--c-ink);letter-spacing:-.02em;line-height:1.5}
.q-input{width:100%;margin-top:9px;background:#FBFAF7;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:14.5px;outline:none;transition:border-color .2s}
.q-input:focus{border-color:var(--c-ink)}

/* 6차시 장면 카드 · 점검 기록표 */
.scene-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:700px){.scene-grid{grid-template-columns:1fr}}
.scene-card{background:#FBFAF7;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.scene-head{display:flex;align-items:center;margin-bottom:8px}
.scene-head b{font-size:13.5px;letter-spacing:-.02em}
.scene-del{margin-left:auto;color:var(--c-sub);font-size:13px;padding:2px 6px;border-radius:6px}
.scene-del:hover{color:var(--c-accent-d)}
.scene-line{display:flex;align-items:center;gap:9px;padding:4px 0}
.scene-lab{flex:0 0 62px;font-size:12.5px;font-weight:800;color:var(--c-sub)}
.scene-line input{flex:1;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13.8px;outline:none;min-width:0;transition:border-color .2s}
.scene-line input:focus{border-color:var(--c-ink)}
.add-row-btn{width:100%;background:#fff;border:1.5px dashed #C9C5BA;color:var(--c-sub);font-weight:800;font-size:13.5px;padding:11px;border-radius:12px;transition:all .15s}
.add-row-btn:hover{border-color:var(--c-ink);color:var(--c-ink)}
.ct-grid{display:grid;grid-template-columns:104px 1fr 1fr;gap:7px;margin-bottom:12px}
.ct-head{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--c-sub);padding:2px 4px}
.ct-grid input{background:#FBFAF7;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:13.8px;outline:none;min-width:0;transition:border-color .2s}
.ct-grid input:focus{border-color:var(--c-ink)}
@media(max-width:700px){.ct-grid{grid-template-columns:80px 1fr 1fr}}

/* AI 도우미 패널 */

.ssh-ico{font-size:15px}

.spine .sn{

/* 업로드 패널 */

/* 작품 모달 */
.shelf-modal{position:fixed;inset:0;background:rgba(61,67,76,.44);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:90;padding:18px}
.sm-card{
  background:#fff;border-radius:20px;max-width:540px;width:100%;max-height:88vh;overflow:auto;
  padding:26px 28px;box-shadow:var(--shadow);

}

.sm-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}

.rx-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

  display:inline-flex;align-items:center;gap:6px;
  background:#FBFAF7;border:1px solid var(--line);border-radius:999px;

}

.sm-foot{display:flex;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--c-sub)}

  display:flex;align-items:center;justify-content:center;transition:all .15s;
}

.type-row{display:flex;gap:7px;flex-wrap:wrap}

/* 감상평 */
.cm-wrap{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}

.cm-list{display:flex;flex-direction:column;gap:6px;max-height:190px;overflow:auto;margin-bottom:10px}

  display:flex;align-items:baseline;gap:8px;

  padding:8px 12px;font-size:13.5px;line-height:1.5;
}
.cm-item b{flex-shrink:0;font-size:12.5px;color:var(--c-mist-d)}
.cm-item span{flex:1;word-break:break-word}
.cm-x{color:#C9C5BA;font-size:11px;padding:2px 4px;border-radius:6px;flex-shrink:0}
.cm-x:hover{color:var(--c-accent-d)}
.cm-empty,.cm-loading{font-size:12.5px;color:var(--c-sub);padding:4px 2px}
.cm-form{display:flex;gap:8px;align-items:center;margin-bottom:9px}

.cm-card{
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:700;color:#565c66;transition:all .15s;
}
.cm-card:hover{border-color:var(--c-ink);color:var(--c-ink);transform:translateY(-1px)}
.cm-card:disabled{opacity:.5}

/* 홈 신간 */
.hs-row{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer}

.hs-row .hs-ico{flex-shrink:0}

.hs-row span{margin-left:auto;flex-shrink:0;font-size:12px;color:var(--c-sub)}

/* ── 꿀팁 / 링크 ───────────────────────── */
.tip-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.masonry{columns:3;column-gap:14px}
.tipcard{
  break-inside:avoid;background:#fff;border:1px solid var(--line);border-radius:16px;
  padding:19px 21px;margin-bottom:14px;
}
.tipcard .tc-top{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.tipcard .tc-top .pill{font-size:11.5px;padding:3px 11px}
.tipcard b.tt{font-size:15px;display:block;margin-bottom:5px;letter-spacing:-.02em}
.tipcard p{font-size:13.5px;color:#565c66;line-height:1.65}
.link-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.linkcard{
  background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 22px;

}
.linkcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm)}

.linkcard .lk-bar{width:26px;height:4px;border-radius:3px;margin-bottom:8px}
.linkcard b{font-size:15.5px;letter-spacing:-.02em}
.linkcard p{font-size:13.3px;color:var(--c-sub);line-height:1.55;flex:1}
.linkcard .url{font-size:11.5px;color:var(--c-mist-d);font-weight:700;word-break:break-all;letter-spacing:.02em}
.lk-group{margin-bottom:28px}
.lk-group h3{font-size:16px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}

.book-grid{display:grid;grid-template-columns:340px 1fr;gap:24px;align-items:start}
.book-cover{
  aspect-ratio:3/4;border-radius:16px;box-shadow:var(--shadow);padding:32px 28px;
  display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:linear-gradient(165deg, color-mix(in srgb,var(--c-mist) 55%,#fff) 0%, color-mix(in srgb,var(--c-sage) 55%,#fff) 100%);
}
.book-cover .bc-title{font-size:27px;font-weight:900;letter-spacing:-.03em;line-height:1.3;color:var(--c-mist-d);word-break:keep-all}
.book-cover .bc-author{margin-top:auto;font-size:14.5px;font-weight:800;color:var(--c-sage-d)}
.book-cover .bc-img-desc{font-size:13px;color:rgba(62,92,110,.6);margin-top:10px;line-height:1.5}
.book-sec{background:#fff;border:1px solid var(--line);border-radius:var(--card-r);padding:22px 26px;margin-bottom:14px}
.book-sec h4{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--c-sub);margin-bottom:10px}
.book-sec .bt{font-size:15px;line-height:1.85;white-space:pre-wrap}
.book-sec .empty{color:#BDB9AE;font-size:14px}
.cert{
  position:relative;background:#fff;border:1px solid var(--c-butter);border-radius:20px;
  box-shadow:var(--shadow);padding:44px;text-align:center;overflow:hidden;margin-top:22px;
}

.cert h3{font-size:12px;letter-spacing:.4em;color:var(--c-butter-d);font-weight:800}

.cert img{width:104px;height:104px;margin:16px auto 6px}
.cert .cert-date{font-size:12.5px;color:var(--c-sub);margin-top:12px;letter-spacing:.04em}

@media (max-width:980px){
  .home-grid,.les-grid,.cal-grid-wrap,.book-grid{grid-template-columns:1fr}

  .link-grid{grid-template-columns:1fr}
  .lesson-grid{grid-template-columns:1fr}
  .hero-qk{display:none}
  .doumi{position:static}
  nav{gap:14px}
}
@media print{
  header,.les-foot,.no-print{display:none!important}
  body{background:#fff}
}
</style>

/* ═══════════ 상태 저장 ═══════════ */
/* 책장 API 주소 — GitHub Pages 미러 등 다른 곳에서 열려도 원본 서버(Higgsfield)의 공유 책장을 그대로 쓴다 */
const QK_API = location.hostname.endsWith('higgsfield.app') ? '' : 'https://quoka-fairytale-studio.higgsfield.app';
/* GitHub Pages 미러에는 공유 책장 서버가 없어 책장 기능 전체를 숨긴다 */
const QK_SHELF = location.hostname.endsWith('higgsfield.app');
if(!QK_SHELF) document.querySelectorAll('.nav-btn[data-v="shelf"]').forEach(b=>b.remove());

let S = {ans:{}, done:{}, events:{}, att:{}, cur:1};
try{ const raw = localStorage.getItem('quokka_studio_v1'); if(raw) S = Object.assign(S, JSON.parse(raw)); }catch(e){}

/* 도구 페이지(4·5·6·7·9·14·15차시 iframe)가 직접 저장하는 차시 답안은
   스튜디오 메모리보다 디스크가 항상 최신 — 저장 전에 반드시 병합해
   학생이 적은 내용이 덮어써지지 않게 한다. */
const TOOL_ANS_KEYS = ['l4','l5','l6','l7','l9','l14','l15'];
function syncToolAns(){
  try{
    const raw = localStorage.getItem('quokka_studio_v1'); if(!raw) return;
    const disk = JSON.parse(raw);
    if(disk && disk.ans) TOOL_ANS_KEYS.forEach(k=>{ if(disk.ans[k]) S.ans[k] = disk.ans[k]; });
  }catch(e){}
}
function save(){ syncToolAns(); try{ localStorage.setItem('quokka_studio_v1', JSON.stringify(S)); }catch(e){} }
window.addEventListener('storage', e=>{ if(e.key==='quokka_studio_v1') syncToolAns(); });

/* 도구 iframe이 알려 주는 실제 높이로 맞춰 하단 여백 제거 */
window.addEventListener('message', e=>{
  const d = e.data || {};
  if(d.qkFrameH){
    document.querySelectorAll('iframe').forEach(f=>{
      if(f.contentWindow === e.source) f.style.height = (d.qkFrameH + 4) + 'px';
    });
  }
  if(d.qkScrollTop){
    document.querySelectorAll('iframe').forEach(f=>{
      if(f.contentWindow === e.source){
        const y = f.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({top:Math.max(0,y), behavior:'smooth'});
      }
    });
  }
});
function A(n){ return S.ans['l'+n] = S.ans['l'+n] || {}; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function doneCount(){ return LESSONS.filter(l=>S.done[l.n]).length; }

/* ═══════════ 라우팅 ═══════════ */
let CURV = 'home';
const ORDER = ['home','lesson','book','shelf','cal','links'];
function go(v, opt){
  if(v==='shelf' && !QK_SHELF) v = 'home';
  const back = ORDER.indexOf(v) < ORDER.indexOf(CURV);
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('show','back'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  const el = document.getElementById('v-'+v);
  ({home:renderHome, lesson:renderLesson, book:renderBook, shelf:renderShelf, cal:renderCal, links:renderLinks})[v](opt);
  void el.offsetWidth;
  el.classList.add('show'); if(back) el.classList.add('back');
  CURV = v; window.scrollTo({top:0});
}
function openLesson(n){ S.cur = n; save(); go('lesson'); }

/* ═══════════ 홈 ═══════════ */
function renderHome(){
  const el = document.getElementById('v-home');
  const dc = doneCount();
  let stagesHtml = STAGES.map(st=>{
    const c = CV[st.c];
    const cards = LESSONS.filter(l=>l.n>=st.range[0]&&l.n<=st.range[1]).map(l=>`
      <button class="lcard" onclick="openLesson(${l.n})">
        <span class="lnum" style="background:${soft(c.bg)};color:${c.d}">${String(l.n).padStart(2,'0')}</span>
        <span><span class="lt">${l.title}</span><br><span class="ls">${l.sub}</span></span>
        <span class="chk">${S.done[l.n]?'✓':''}</span>
      </button>`).join('');
    return `<div class="stage-block">
      <div class="stage-head">
        <span class="dot" style="background:${c.bg}"></span>
        <span class="ov"><b>${st.en}</b> · ${st.name}</span>
        <span class="rng">${st.rngLabel || (st.range[0]+'–'+st.range[1]+'차시')}</span>
      </div>
      <div class="lesson-grid">${cards}</div></div>`;
  }).join('');

function buildPrompt(L){
  if(L.promptFrom){
    const a = A(L.n);
    const parts = L.promptFrom.map(k=>a[k]).filter(Boolean);
    if(parts.length) return parts.join('\n');
  }
  return L.prompt || '';
}
function onAns(n, elm){ A(n)[elm.dataset.k] = elm.value; save(); syncPrompt(n); }
function setAns(n, k, v){ A(n)[k] = v; save(); renderLesson(); }
function togglePill(n, k, v, max){
  const a = A(n); a[k] = a[k]||[];
  const i = a[k].indexOf(v);
  if(i>=0) a[k].splice(i,1);
  else { if(a[k].length>=max) a[k].shift(); a[k].push(v); }
  save(); renderLesson();
}
function syncPrompt(n){
  const L = LESSONS.find(l=>l.n===n);
  const pre = document.getElementById('promptPre');
  if(pre && L && L.promptFrom) pre.textContent = buildPrompt(L);
}
function copyPrompt(n){
  const L = LESSONS.find(l=>l.n===n);
  const txt = buildPrompt(L);
  (navigator.clipboard?.writeText(txt) || Promise.reject()).then(()=>toast('프롬프트를 복사했어요'))
   .catch(()=>{ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('프롬프트를 복사했어요'); });
}
function toggleDone(n){
  S.done[n] = !S.done[n]; save(); renderLesson();
  if(S.done[n]) toast(n===15?'작가 데뷔를 축하합니다. [내 책]에서 데뷔 증서를 확인하세요':n+'차시 완료');
}
function quizPick(qi, oi, a){
  const btn = document.getElementById('qo'+qi+'_'+oi);
  btn.classList.add(oi===a?'ok':'no');
  if(oi===a) document.getElementById('qex'+qi).style.display='block';
}
let timerId=null;
function startTimer(min){
  const btn = document.getElementById('timerBtn'); if(!btn) return;
  if(timerId){ clearInterval(timerId); timerId=null; btn.classList.remove('run'); btn.textContent=min+'분 멈추지 않고 쓰기'; return; }
  let left = min*60;
  btn.classList.add('run');
  timerId = setInterval(()=>{
    left--;
    btn.textContent = String(Math.floor(left/60)).padStart(2,'0') + ':' + String(left%60).padStart(2,'0') + ' — 멈추지 말고!';
    if(left<=0){ clearInterval(timerId); timerId=null; btn.classList.remove('run'); btn.textContent='완주! 끝까지 썼어요'; toast('멈추지 않고 끝까지 썼어요. 초고는 고치기 위해 쓰는 글'); }
  },1000);
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--c-ink);color:#fff;padding:12px 26px;border-radius:99px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);z-index:99;transition:opacity .3s;';
    document.body.appendChild(t); }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity='0', 2600);
}

function ckFind(text, entries){
  let negatedAny = false;
  for(const {w, neg} of entries){
    let searchFrom = 0;
    while(true){
      const idx = text.indexOf(w, searchFrom);
      if(idx === -1) break;
      if(!neg) return { found:true, negated:false, matched:w };
      const after = text.slice(idx + w.length, idx + w.length + 8);
      const before = text.slice(Math.max(0, idx - 3), idx);
      const isNeg = CK_NEG_AFTER.some(n => after.includes(n)) || CK_NEG_BEFORE.test(before);
      if(!isNeg) return { found:true, negated:false, matched:w };
      negatedAny = true;
      searchFrom = idx + 1;
    }
  }
  return { found:false, negated:negatedAny, matched:null };
}

function ckClassify(sk, text){
  const t = (text || "").trim();
  if(!t) return { level:"C", empty:true };
  if(sk === "기"){
    const want = ckFind(t, CK_WANT), long = t.length >= 12;
    let level = "B";
    if(want.found && long) level = "A";
    else if(!want.found && !want.negated && !long) level = "C";
    return { level, want, long };
  }
  if(sk === "승"){
    const trans = ckFind(t, CK_TRANS), long = t.length >= 12;
    let level = "B";
    if(trans.found && long) level = "A";
    else if(!trans.found && !long) level = "C";
    return { level, trans, long };
  }
  if(sk === "전"){
    const goal = ckFind(t, [...CK_WANT, ...CK_PURPOSE, ...CK_ACH]);
    const fear = ckFind(t, CK_FEAR);
    const hasConnective = CK_CONTRAST.some(e => t.includes(e.w));
    let level = "B";
    if(goal.found && fear.found) level = "A";
    else if((!goal.found && !goal.negated) && (!fear.found && !fear.negated)) level = "C";
    return { level, goal, fear, hasConnective };
  }
  if(sk === "결"){
    const change = ckFind(t, CK_CHANGE), long = t.length >= 10;
    let level = "B";
    if(change.found && long) level = "A";
    else if(!change.found && !change.negated && !long) level = "C";
    return { level, change, long };
  }
}

function shelfSetType(t, el){
  shelfUpType = t;
  if(el) el.parentElement.querySelectorAll('.e-pill').forEach(b=>b.classList.toggle('sel', b===el));
}
function shelfSetColor(c, el){
  shelfColor = c;
  if(el) el.parentElement.querySelectorAll('.csw').forEach(s=>s.classList.toggle('on', s===el));
}
function shelfFilePicked(inp){
  const f = inp.files[0]; if(!f) return;
  document.getElementById('upFileName').textContent = '📎 ' + f.name;
  const row = document.getElementById('upTypeRow');
  if(f.type.startsWith('audio')){ shelfUpType='reading'; }
  else if(f.type.startsWith('image') && shelfUpType==='reading'){ shelfUpType='bookmark'; }
  if(row) row.querySelectorAll('.e-pill').forEach(b=>b.classList.toggle('sel', b.dataset.t===shelfUpType));
}
function shelfJumpType(t){ shelfUpOpen = true; shelfUpType = t; go('shelf'); }
function shelfJumpCover(){ shelfJumpType('cover'); }

function fmtShelfDate(ts){ const d = new Date(ts); return (d.getMonth()+1)+'월 '+d.getDate()+'일'; }
function spineH(id){ let h=0; for(const ch of id) h=(h*31+ch.charCodeAt(0))>>>0; return 104 + (h % 34); }
function shelfTotal(p){ return (p.clap||0)+(p.heart||0)+(p.party||0); }

function renderShelf(){
  const el = document.getElementById('v-shelf');
  const list = shelfPosts === null ? null
    : shelfPosts
      .filter(p=>shelfFilter==='all'||p.type===shelfFilter)
      .sort((a,b)=> shelfSort==='cheer' ? (shelfTotal(b)-shelfTotal(a))||(b.created_at-a.created_at) : b.created_at-a.created_at);

  let wall;
  if(list===null){
    wall = `<div class="shelf-empty">책장을 살펴보는 중이에요… 🔍</div>`;
  } else if(shelfPosts.error){
    wall = `<div class="shelf-empty"><b>지금은 책장에 연결할 수 없어요.</b><br>온라인 스튜디오(배포 주소)에서 열면 친구들의 작품을 볼 수 있어요.</div>`;
  } else if(!list.length){
    wall = `<div class="shelf-empty">아직 이 칸의 책장이 비어 있어요.<br><b>첫 번째 작가</b>가 되어 볼까요? 위의 [내 작품 올리기]를 눌러 보세요 ✦</div>`;
  } else {
    shelfCurList = [];
    const spineHtml = p => `
      <button class="spine" style="background:${esc(p.color||SHELF_COLORS[0])};height:${spineH(p.id)}px" onclick="shelfOpen('${p.id}')" title="${TYPE_LESSON[p.type]||''}차시 · ${esc(p.title)} · ${esc(p.penname)}">
        ${TYPE_LESSON[p.type]?`<span class="sn">${TYPE_LESSON[p.type]}</span>`:''}
        <span class="st">${esc(p.title)}</span>
        <span class="sdeco"></span>
        <span class="se">${TYPE_ICO[p.type]||'🔖'}</span>
      </button>`;
    const groups = TYPE_ORDER.filter(t=>list.some(p=>p.type===t));
    wall = groups.map(t=>{
      const posts = list.filter(p=>p.type===t);
      posts.forEach(p=>shelfCurList.push(p.id));
      return `<div class="shelf-sec">
        <div class="shelf-sec-head">
          <span class="ssh-ico">${TYPE_ICO[t]}</span><b>${TYPE_LABEL[t]}</b>
          <span class="ssh-les">${TYPE_LESSON[t]}차시 작품</span>
          <span class="ssh-cnt">${posts.length}권</span>
        </div>
        <div class="shelf-grid">${posts.map(spineHtml).join('')}</div>
      </div>`;
    }).join('');
  }

  const pen = esc(A(1).penname||'');
  el.innerHTML = `
  <h2 class="sec">경기온라인학교 동화작가들의 책장</h2>
  <p class="sec-sub">친구들의 낭독과 책갈피가 꽂혀 있는 우리들의 책장이에요. 책등을 눌러 꺼내 보고, 응원 스탬프를 찍어 주세요.</p>
  <div class="shelf-top">
    <button class="e-pill ${shelfFilter==='all'?'sel':''}" onclick="shelfFilter='all';renderShelf()">전체</button>
    ${TYPE_ORDER.map(t=>`<button class="e-pill ${shelfFilter===t?'sel':''}" onclick="shelfFilter='${t}';renderShelf()">${TYPE_ICO[t]} ${TYPE_SHORT[t]} <i class="fn">${TYPE_LESSON[t]}차시</i></button>`).join('')}
    <span class="spacer"></span>
    <button class="e-pill ${shelfSort==='new'?'sel':''}" onclick="shelfSort='new';renderShelf()">최신순</button>
    <button class="e-pill ${shelfSort==='cheer'?'sel':''}" onclick="shelfSort='cheer';renderShelf()">응원순</button>
    <button class="cta" style="padding:10px 18px;font-size:14px" onclick="shelfUpOpen=!shelfUpOpen;renderShelf()">${shelfUpOpen?'닫기':'내 작품 올리기'}</button>
  </div>
  ${shelfUpOpen?`
  <div class="up-panel">
    <h3>내 작품 올리기 — 낭독 녹음(오디오) 또는 책갈피(이미지)</h3>
    <div class="up-grid">
      <label class="up-file" style="grid-column:1/-1">
        <span id="upFileName">📂 파일 고르기 — 낭독 녹음(오디오) 또는 책갈피·표지(이미지)</span>
        <input type="file" id="upFile" accept="audio/*,image/png,image/jpeg,image/webp" onchange="shelfFilePicked(this)">
      </label>
      <div class="up-field" style="grid-column:1/-1"><label>작품 종류</label>
        <div class="type-row" id="upTypeRow">
          <button class="e-pill ${shelfUpType==='character'?'sel':''}" data-t="character" onclick="shelfSetType('character',this)">🦸 캐릭터 시트 (4차시)</button>
          <button class="e-pill ${shelfUpType==='emotion'?'sel':''}" data-t="emotion" onclick="shelfSetType('emotion',this)">💛 감정동화 (3차시)</button>
          <button class="e-pill ${shelfUpType==='cover'?'sel':''}" data-t="cover" onclick="shelfSetType('cover',this)">🎨 동화 표지 (10차시)</button>
          <button class="e-pill ${shelfUpType==='bookmark'?'sel':''}" data-t="bookmark" onclick="shelfSetType('bookmark',this)">🔖 책갈피 (14차시)</button>
          <button class="e-pill ${shelfUpType==='reading'?'sel':''}" data-t="reading" onclick="shelfSetType('reading',this)">🎙️ 낭독 (15차시)</button>
        </div>
      </div>
      <div class="up-field"><label>필명 (실명 금지!)</label><input type="text" id="upPen" maxlength="20" value="${pen}" placeholder="예: 한로운 작가"></div>
      <div class="up-field"><label>작품 제목</label><input type="text" id="upTitle" maxlength="40" placeholder="예: 작게, 시작"></div>
      <div class="up-field" style="grid-column:1/-1"><label>한 줄 소개</label><input type="text" id="upMsg" maxlength="100" placeholder="예: 발표가 무서웠던 로운이의 첫 한마디를 들어 주세요"></div>
      <div class="up-field"><label>책등 색깔</label><div class="color-row">${SHELF_COLORS.map(c=>`<span class="csw ${c===shelfColor?'on':''}" style="background:${c}" onclick="shelfSetColor('${c}',this)"></span>`).join('')}</div></div>
      <div class="up-field"><label>삭제 비밀번호 (숫자 4자리 — 꼭 기억!)</label><input type="password" id="upPin" maxlength="4" inputmode="numeric" placeholder="0000"></div>

    <p class="shelf-note" style="text-align:left;margin-top:10px">🔒 실명·얼굴 사진·친구 정보는 올리지 않아요. 우리는 필명으로 만나는 작가들!</p>
  </div>`:''}
  <div class="shelf-wall">${wall}</div>
  <p class="shelf-note">책등을 누르면 작품을 꺼내 볼 수 있어요 · 응원 스탬프는 작품마다 한 번씩</p>`;

  if(shelfPosts===null) shelfLoad();
}

async function shelfLoad(){
  try{
    const r = await fetch(QK_API+'/api/bookshelf/list');
    const j = await r.json();
    shelfPosts = j.ok ? j.posts : Object.assign([], {error:true});
  }catch(e){ shelfPosts = Object.assign([], {error:true}); }
  if(CURV==='shelf') renderShelf();
}

async function shelfUpload(){
  if(shelfBusy) return;
  const f = document.getElementById('upFile').files[0];
  const pen = document.getElementById('upPen').value.trim();
  const title = document.getElementById('upTitle').value.trim();
  const msg = document.getElementById('upMsg').value.trim();
  const pin = document.getElementById('upPin').value.trim();
  const out = document.getElementById('upMsgOut');
  const say = (t,ok)=>{ out.textContent=t; out.style.color = ok?'var(--c-sage-d)':'var(--c-accent-d)'; };
  if(!f) return say('먼저 파일을 골라 주세요!');
  if(!pen||!title) return say('필명과 제목을 적어 주세요!');
  if(!/^\d{4}$/.test(pin)) return say('삭제 비밀번호는 숫자 4자리예요!');
  let type = shelfUpType;
  if(f.type.startsWith('audio')) type = 'reading';
  else if(f.type.startsWith('image')){ if(type === 'reading') type = 'bookmark'; }
  else return say('오디오 또는 이미지 파일만 올릴 수 있어요!');
  if(f.size > 8*1024*1024) return say('파일이 너무 커요 (8MB까지)!');
  shelfBusy = true; document.getElementById('upGo').textContent='꽂는 중…'; say('책장에 꽂는 중이에요…',true);
  try{
    const fd = new FormData();
    fd.append('file', f); fd.append('type', type); fd.append('penname', pen);
    fd.append('title', title); fd.append('msg', msg); fd.append('color', shelfColor); fd.append('pin', pin);
    const r = await fetch(QK_API+'/api/bookshelf/upload', {method:'POST', body:fd});
    const j = await r.json();
    if(!j.ok) throw new Error(j.code);
    shelfUpOpen = false; shelfPosts = null;
    toast('책장에 꽂혔어요! 친구들의 응원을 기다려요 📚');
    renderShelf();
  }catch(e){
    say(e.message==='bad_words' ? '앗, 고운 말로 바꿔 볼까요? 필명·제목·한 줄 소개를 다시 봐 주세요.' : '올리지 못했어요. 파일과 인터넷 연결을 확인해 주세요.');
  }
  document.getElementById('upGo').textContent='책장에 꽂기';
  shelfBusy = false;
}

      <div class="cm-head">💬 감상평 <span id="cmCount"></span></div>

        <input type="text" id="cmPen" maxlength="20" placeholder="필명을 적고 아래 카드를 눌러요" value="${esc(A(1).penname||'')}">
      </div>
      <div class="cm-cards">${COMMENT_CARDS.map((c,i)=>`<button class="cm-card" onclick="shelfComment('${p.id}',${i},this)">${c}</button>`).join('')}</div>
    </div>
    <div class="sm-foot">
      <span>피드백은 점수가 아니라 마음으로</span>
      <button class="sm-del" onclick="shelfDelete('${p.id}')">작품 삭제</button>
    </div>
    <button class="sm-arrow prev" ${idx<=0?'disabled':''} onclick="shelfNav(-1)" title="이전 작품">‹</button>
    <button class="sm-arrow next" ${idx>=shelfCurList.length-1?'disabled':''} onclick="shelfNav(1)" title="다음 작품">›</button>
  </div>`;
  document.body.appendChild(m);
  shelfCountView(p);
  shelfLoadComments(p.id);
}

function shelfNav(dir){
  const m = document.getElementById('shelfModal'); if(!m) return;
  const idx = shelfCurList.indexOf(m.dataset.pid);
  const next = shelfCurList[idx+dir];
  if(next) shelfOpen(next);
}
document.addEventListener('keydown', e=>{
  if(!document.getElementById('shelfModal')) return;
  if(e.key==='ArrowRight') shelfNav(1);
  else if(e.key==='ArrowLeft') shelfNav(-1);
  else if(e.key==='Escape'){ const m=document.getElementById('shelfModal'); if(m) m.remove(); }
});

async function shelfCountView(p){
  const guard = 'qshelf_v_'+p.id;
  try{ if(localStorage.getItem(guard)) return; }catch(e){}
  try{
    const r = await fetch(QK_API+'/api/bookshelf/view', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:p.id})});
    const j = await r.json();
    if(j.ok){
      try{ localStorage.setItem(guard,'1'); }catch(e){}
      p.views = j.views;
      const n = document.getElementById('smViews'); if(n) n.textContent = j.views;
    }
  }catch(e){}
}

async function shelfLoadComments(id){
  const box = document.getElementById('cmList'); if(!box) return;
  try{
    const r = await fetch(QK_API+'/api/bookshelf/comments?post='+id);
    const j = await r.json();
    if(!j.ok) throw 0;
    const cnt = document.getElementById('cmCount'); if(cnt) cnt.textContent = j.comments.length ? j.comments.length+'개' : '';
    box.innerHTML = j.comments.length
      ? j.comments.map(c=>`<div class="cm-item"><b>${esc(c.penname)}</b><span>${esc(c.text)}</span><button class="cm-x" title="감상평 지우기 (작품 비밀번호)" onclick="shelfCommentDel('${c.id}','${id}')">✕</button></div>`).join('')
      : `<span class="cm-empty">아직 감상평이 없어요. 첫 마음을 남겨 볼까요?</span>`;
  }catch(e){ box.innerHTML = '<span class="cm-empty">감상평을 불러오지 못했어요.</span>'; }
}

async function shelfComment(postId, cardIdx, btn){
  const pen = (document.getElementById('cmPen')||{}).value?.trim();
  const text = COMMENT_CARDS[cardIdx];
  if(!pen){ toast('먼저 필명을 적어 주세요'); document.getElementById('cmPen')?.focus(); return; }
  if(!text) return;
  if(btn) btn.disabled = true;
  try{
    const r = await fetch(QK_API+'/api/bookshelf/comments', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({post_id:postId, penname:pen, text})});
    const j = await r.json();
    if(!j.ok) throw new Error(j.code);
    shelfLoadComments(postId);
    toast('감상평 카드를 남겼어요 💬');
  }catch(e){
    toast(e.message==='bad_words' ? '필명에 고운 말을 사용해 주세요' : '감상평을 남기지 못했어요');
  }
  if(btn) btn.disabled = false;
}

async function shelfCommentDel(cid, postId){
  const pin = prompt('감상평을 지우려면 이 작품의 삭제 비밀번호(숫자 4자리)를 입력하세요.');
  if(pin===null) return;
  try{
    const r = await fetch(QK_API+'/api/bookshelf/comment-remove', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:cid, pin:String(pin).trim()})});
    const j = await r.json();
    if(j.ok){ shelfLoadComments(postId); toast('감상평을 지웠어요'); }
    else toast(j.code==='wrong_pin'?'비밀번호가 맞지 않아요':'지우지 못했어요');
  }catch(e){ toast('지우지 못했어요'); }
}

async function shelfReact(id, kind){
  const guard = 'qshelf_rx_'+id+'_'+kind;
  try{ if(localStorage.getItem(guard)){ toast('이 작품에는 이미 '+({clap:'👏 박수',heart:'💛 감동',party:'🎉 축하'})[kind]+' 스탬프를 찍었어요'); return; } }catch(e){}
  const btn = document.getElementById('rx_'+kind);
  if(btn){ btn.classList.remove('hit'); void btn.offsetWidth; btn.classList.add('hit'); }
  try{
    const r = await fetch(QK_API+'/api/bookshelf/react', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id, kind})});
    const j = await r.json();
    if(j.ok){
      try{ localStorage.setItem(guard,'1'); }catch(e){}
      ['clap','heart','party'].forEach(k=>{ const n=document.getElementById('rxn_'+k); if(n) n.textContent=j.counts[k]; });
      const p=(shelfPosts||[]).find(x=>x.id===id); if(p) Object.assign(p, j.counts);
    }
  }catch(e){}
}

async function shelfDelete(id){
  const pin = prompt('이 작품을 올릴 때 정한 삭제 비밀번호(숫자 4자리)를 입력하세요.');
  if(pin===null) return;
  try{
    const r = await fetch(QK_API+'/api/bookshelf/remove', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id, pin:String(pin).trim()})});
    const j = await r.json();
    if(j.ok){
      const m=document.getElementById('shelfModal'); if(m) m.remove();
      shelfPosts=null; toast('책장에서 내렸어요'); renderShelf();
    } else {
      toast(j.code==='wrong_pin'?'비밀번호가 맞지 않아요':'삭제하지 못했어요');
    }
  }catch(e){ toast('삭제하지 못했어요'); }
}

/* ═══════════ 캘린더 · 출석 ═══════════ */
let calY, calM, calSel;
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function renderCal(){
  const now = new Date();
  if(calY===undefined){ calY=now.getFullYear(); calM=now.getMonth(); calSel=fmtDate(now); }
  const el = document.getElementById('v-cal');
  const first = new Date(calY, calM, 1);
  const start = new Date(first); start.setDate(1-first.getDay());
  let cells = '';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const key = fmtDate(d);
    const other = d.getMonth()!==calM;
    const today = key===fmtDate(now);
    const evs = (S.events[key]||[]).slice(0,2).map(e=>`<div class="ev" style="background:${e.c||soft('var(--c-mist)')};color:var(--c-ink)">${esc(e.t)}</div>`).join('');
    const more = (S.events[key]||[]).length>2 ? `<div class="ev" style="background:transparent;color:var(--c-sub)">+${S.events[key].length-2}</div>`:'';
    cells += `<div class="cal-cell ${other?'other':''} ${today?'today':''} ${key===calSel?'seld':''}" onclick="selDay('${key}')">
      <span class="d ${d.getDay()===0?'sun':''}">${d.getDate()}</span>
      ${S.att[key]?'<span class="att-dot">✓</span>':''}${evs}${more}</div>`;
  }
  const attCnt = Object.keys(S.att).length;
  const monthAtt = Object.keys(S.att).filter(k=>k.startsWith(calY+'-'+String(calM+1).padStart(2,'0'))).length;
  const selEvs = (S.events[calSel]||[]).map((e,i)=>`<div class="ev-line"><span>${e.t}</span><button onclick="delEv('${calSel}',${i})">✕</button></div>`).join('') || '<p style="font-size:13.5px;color:var(--c-sub)">등록된 일정이 없어요.</p>';
  const selAtt = !!S.att[calSel];
  el.innerHTML = `
  <h2 class="sec">프로젝트 캘린더 · 출석부</h2>
  <p class="sec-sub">차시별 학습 일정을 등록하고, 경기온라인학교 수강 출석을 기록해요.</p>
  <div class="cal-grid-wrap">
    <div class="card">
      <div class="cal-head">
        <button class="cal-nav" onclick="mvCal(-1)">‹</button>
        <h3>${calY}년 ${calM+1}월</h3>
        <button class="cal-nav" onclick="mvCal(1)">›</button>
        <span style="margin-left:auto;font-size:12.5px;color:var(--c-sub)">✓ 출석한 날</span>
      </div>
      <div class="cal-table">
        ${['일','월','화','수','목','금','토'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
    </div>
    <div>
      <div class="side-card day-panel">
        <h4>${calSel.replace(/-/g,'. ')}.</h4>
        ${selEvs}
        <div class="add-ev">
          <input id="evInput" placeholder="일정 입력 (예: 3차시 감정 탐험)" onkeydown="if(event.key==='Enter')addEv()">
          <button onclick="addEv()">추가</button>
        </div>
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          ${[1,4,7,12,15].map(n=>`<button class="e-pill" style="font-size:12.5px;padding:5px 13px" onclick="addEvQuick(${n})">+ ${n}차시</button>`).join('')}
        </div>
        <button class="att-big ${selAtt?'did':''}" onclick="toggleAtt('${calSel}')">${selAtt?'출석 완료 · 누르면 취소':'이 날 출석 등록'}</button>
      </div>
      <div class="side-card">
        <h3>출석 현황</h3>
        <div class="att-stats">
          <div class="att-stat"><b>${monthAtt}</b><span>이번 달 출석</span></div>
          <div class="att-stat"><b>${attCnt}</b><span>누적 출석</span></div>
          <div class="att-stat"><b>${doneCount()}</b><span>완료 차시</span></div>
        </div>
        <div class="quick-links" style="margin-top:12px">
          <a class="ql" href="https://online.goe.go.kr" target="_blank" rel="noopener">경기온라인학교 바로가기</a>
        </div>
      </div>
    </div>
  </div>`;
}
function mvCal(d){ calM+=d; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} renderCal(); }
function selDay(k){ calSel=k; renderCal(); }
function addEv(){
  const inp = document.getElementById('evInput');
  if(!inp.value.trim()) return;
  (S.events[calSel]=S.events[calSel]||[]).push({t:inp.value.trim(), c:soft('var(--c-mist)')});
  save(); renderCal();
}
function addEvQuick(n){
  const L = LESSONS.find(l=>l.n===n);
  const sc = CV[stageOf(n).c];
  (S.events[calSel]=S.events[calSel]||[]).push({t:n+'차시 '+L.title, c:soft(sc.bg)});
  save(); renderCal();
}
function delEv(k,i){ S.events[k].splice(i,1); if(!S.events[k].length) delete S.events[k]; save(); renderCal(); }
function toggleAtt(k){ if(S.att[k]) delete S.att[k]; else S.att[k]='경기온라인학교 수강'; save(); renderCal(); }

/* ═══════════ 링크 ═══════════ */
function renderLinks(){
  const el = document.getElementById('v-links');
  el.innerHTML = `
  <h2 class="sec">동화작가의 책갈피</h2>
  <p class="sec-sub">동화를 쓸 때 참고하는 웹사이트 — 카드를 누르면 새 탭으로 열려요.</p>
  ${LINKS.map(g=>`
    <div class="lk-group"><h3>${g.g}</h3>
    <div class="link-grid">
      ${g.items.map(it=>`
        <a class="linkcard" href="${it.u}" target="_blank" rel="noopener">
          <span class="lk-bar" style="background:${CV[it.c].bg}"></span>
          <b>${it.b}</b><p>${it.p}</p><span class="url">${it.u.replace('https://','')}</span>
        </a>`).join('')}
    </div></div>`).join('')}
  <div class="card" style="display:flex;align-items:center;gap:18px">
    <img class="qk" src="${QUOKKA_FACE}" style="width:56px;height:56px" alt="쿼카">
    <div><b style="font-size:15.5px">안전 약속, 잊지 않기</b>
    <p style="font-size:14px;color:var(--c-sub);margin-top:3px">외부 사이트에서도 내 이름·학교·친구 이름은 입력하지 않아요. AI의 답은 참고만, 최종 결정은 언제나 작가인 내가.</p></div>
  </div>`;
}

/* 시작 */
go(location.hash==='#shelf' ? 'shelf' : 'home');
</script>
</body>
</html>
